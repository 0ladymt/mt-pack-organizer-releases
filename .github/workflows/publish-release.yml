name: Build e publicar MT Pack Organizer

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "patches/notes.md"
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Ler versão diretamente da fonte
        id: meta
        shell: pwsh
        run: |
          $line = Get-Content -LiteralPath "src\MT_Pack_Organizer.ps1" | Where-Object { $_ -like '$script:AppVersion*' } | Select-Object -First 1
          if (-not $line) { throw "AppVersion não encontrada em src/MT_Pack_Organizer.ps1." }
          $target = ($line -split "'")[1]
          if (-not $target) { throw "Não consegui ler AppVersion na fonte." }
          "target=$target" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "target_tag=v$target" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verificar se a release já existe
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.target_tag }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          exit 0

      - name: Preparar fonte direta
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          TARGET: ${{ steps.meta.outputs.target }}
        run: |
          New-Item -ItemType Directory -Force -Path work\assets | Out-Null
          Copy-Item -LiteralPath "src\MT_Pack_Organizer.ps1" -Destination "work\MT_Pack_Organizer.ps1" -Force
          Copy-Item -LiteralPath "src\assets\mt_logo.png" -Destination "work\assets\mt_logo.png" -Force
          Copy-Item -LiteralPath "src\assets\mt_butterfly_icon.png" -Destination "work\assets\mt_butterfly_icon.png" -Force
          Copy-Item -LiteralPath "src\assets\mt_app_icon.ico" -Destination "work\assets\mt_app_icon.ico" -Force

          $src = Get-Content -Raw -LiteralPath "work\MT_Pack_Organizer.ps1"
          if ($src -notmatch [regex]::Escape($env:TARGET)) { throw "A versão $env:TARGET não apareceu na fonte." }
          foreach($asset in @(
            "work\assets\mt_logo.png",
            "work\assets\mt_butterfly_icon.png",
            "work\assets\mt_app_icon.ico"
          )){
            if (-not (Test-Path $asset)) { throw "Asset oficial ausente: $asset" }
            if ((Get-Item $asset).Length -lt 1000) { throw "Asset oficial inválido ou incompleto: $asset" }
          }

      - name: Validar gerador YMT antes de publicar
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $env:MT_PACK_ORGANIZER_SELFTEST = '1'
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "work\MT_Pack_Organizer.ps1"
          if ($LASTEXITCODE -ne 0) { throw "O gerador YMT falhou no teste automático. A release não será publicada." }

      - name: Preparar ferramentas Go
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          go version
          go install github.com/akavel/rsrc@latest
          $rsrc = Join-Path $env:USERPROFILE "go\bin\rsrc.exe"
          if (-not (Test-Path $rsrc)) { throw "rsrc.exe não foi instalado." }
          "RSRC=$rsrc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compilar aplicativo
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.target }}
        run: |
          New-Item -ItemType Directory -Force -Path build\app\payload\assets | Out-Null
          Copy-Item work\MT_Pack_Organizer.ps1 build\app\payload\MT_Pack_Organizer.ps1 -Force
          Copy-Item work\assets\mt_logo.png build\app\payload\assets\mt_logo.png -Force
          Copy-Item work\assets\mt_butterfly_icon.png build\app\payload\assets\mt_butterfly_icon.png -Force
          Copy-Item work\assets\mt_app_icon.ico build\app\payload\assets\mt_app_icon.ico -Force

          $main = @"
          package main

          import (
              "embed"
              "io/fs"
              "os"
              "os/exec"
              "path/filepath"
              "syscall"
          )

          //go:embed payload/* payload/assets/*
          var payload embed.FS

          func writeFile(root, src, dst string) error {
              b, err := fs.ReadFile(payload, src)
              if err != nil { return err }
              full := filepath.Join(root, dst)
              if err := os.MkdirAll(filepath.Dir(full), 0755); err != nil { return err }
              if old, err := os.ReadFile(full); err == nil && string(old) == string(b) { return nil }
              return os.WriteFile(full, b, 0644)
          }

          func main() {
              base := os.Getenv("LOCALAPPDATA")
              if base == "" { base = os.TempDir() }
              runtimeDir := filepath.Join(base, "MT Studio", "Pack Organizer", "runtime", "$env:VERSION")
              _ = writeFile(runtimeDir, "payload/MT_Pack_Organizer.ps1", "MT_Pack_Organizer.ps1")
              _ = writeFile(runtimeDir, "payload/assets/mt_logo.png", filepath.Join("assets", "mt_logo.png"))
              _ = writeFile(runtimeDir, "payload/assets/mt_butterfly_icon.png", filepath.Join("assets", "mt_butterfly_icon.png"))
              _ = writeFile(runtimeDir, "payload/assets/mt_app_icon.ico", filepath.Join("assets", "mt_app_icon.ico"))

              ps := filepath.Join(runtimeDir, "MT_Pack_Organizer.ps1")
              cmd := exec.Command("powershell.exe", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-WindowStyle", "Hidden", "-File", ps)
              cmd.SysProcAttr = &syscall.SysProcAttr{HideWindow: true}
              _ = cmd.Start()
          }
          "@
          Set-Content -LiteralPath build\app\main.go -Value $main -Encoding utf8

          Push-Location build\app
          go mod init mtstudio/packorganizer/app
          & $env:RSRC -ico payload\assets\mt_app_icon.ico -o rsrc.syso
          go build -trimpath -ldflags="-H windowsgui -s -w" -o "MT Pack Organizer.exe" .
          Pop-Location
          if (-not (Test-Path "build\app\MT Pack Organizer.exe")) { throw "Aplicativo não foi compilado." }

      - name: Compilar instalador
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.target }}
        run: |
          New-Item -ItemType Directory -Force -Path build\installer\payload | Out-Null
          Copy-Item "build\app\MT Pack Organizer.exe" build\installer\payload\app.exe -Force
          Copy-Item work\assets\mt_app_icon.ico build\installer\mt_app_icon.ico -Force

          $main = @'
          package main

          import (
              "embed"
              "fmt"
              "os"
              "os/exec"
              "path/filepath"
              "strconv"
              "strings"
              "syscall"
              "time"
          )

          //go:embed payload/app.exe
          var payload embed.FS

          var (
              kernel32 = syscall.NewLazyDLL("kernel32.dll")
              procOpenProcess = kernel32.NewProc("OpenProcess")
              procWaitForSingleObject = kernel32.NewProc("WaitForSingleObject")
              procCloseHandle = kernel32.NewProc("CloseHandle")
          )

          const (
              synchronize = 0x00100000
              infinite = 0xFFFFFFFF
          )

          func waitPID(pid uint32) {
              h, _, _ := procOpenProcess.Call(synchronize, 0, uintptr(pid))
              if h != 0 {
                  procWaitForSingleObject.Call(h, infinite)
                  procCloseHandle.Call(h)
                  return
              }
              time.Sleep(1200 * time.Millisecond)
          }

          func runHidden(name string, args ...string) error {
              cmd := exec.Command(name, args...)
              cmd.SysProcAttr = &syscall.SysProcAttr{HideWindow: true}
              return cmd.Run()
          }

          func main() {
              args := os.Args[1:]
              for i := 0; i < len(args)-1; i++ {
                  if strings.EqualFold(args[i], "--waitpid") {
                      if n, err := strconv.ParseUint(args[i+1], 10, 32); err == nil { waitPID(uint32(n)) }
                  }
              }

              local := os.Getenv("LOCALAPPDATA")
              if local == "" { local = os.TempDir() }
              installDir := filepath.Join(local, "MT Studio", "Pack Organizer")
              if err := os.MkdirAll(installDir, 0755); err != nil { return }
              appPath := filepath.Join(installDir, "MT Pack Organizer.exe")
              b, err := payload.ReadFile("payload/app.exe")
              if err != nil { return }

              ok := false
              for i := 0; i < 30; i++ {
                  tmp := appPath + ".new"
                  _ = os.Remove(tmp)
                  if err := os.WriteFile(tmp, b, 0755); err == nil {
                      _ = os.Remove(appPath + ".old")
                      _ = os.Rename(appPath, appPath+".old")
                      if err := os.Rename(tmp, appPath); err == nil { ok = true; break }
                  }
                  time.Sleep(250 * time.Millisecond)
              }
              if !ok { return }
              _ = os.Remove(appPath + ".old")

              desktop := `[Environment]::GetFolderPath('Desktop')`
              startmenu := `[Environment]::GetFolderPath('StartMenu')`
              ps := fmt.Sprintf(`$app=%q; $w=New-Object -ComObject WScript.Shell; $d=%s; $s=%s; $sm=Join-Path $s 'Programs\MT Studio'; New-Item -ItemType Directory -Force -Path $sm|Out-Null; foreach($p in @((Join-Path $d 'MT Pack Organizer.lnk'),(Join-Path $sm 'MT Pack Organizer.lnk'))){$l=$w.CreateShortcut($p);$l.TargetPath=$app;$l.WorkingDirectory=(Split-Path $app);$l.IconLocation=$app+',0';$l.Description='MT Studio Pack Organizer';$l.Save()}`, appPath, desktop, startmenu)
              _ = runHidden("powershell.exe", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-WindowStyle", "Hidden", "-Command", ps)

              cmd := exec.Command(appPath)
              cmd.SysProcAttr = &syscall.SysProcAttr{HideWindow: true}
              _ = cmd.Start()
          }
          '@
          Set-Content -LiteralPath build\installer\main.go -Value $main -Encoding utf8

          Push-Location build\installer
          go mod init mtstudio/packorganizer/installer
          & $env:RSRC -ico mt_app_icon.ico -o rsrc.syso
          $out = "MT_Pack_Organizer_Setup_$env:VERSION.exe"
          go build -trimpath -ldflags="-H windowsgui -s -w" -o $out .
          Pop-Location
          if (-not (Test-Path "build\installer\MT_Pack_Organizer_Setup_$env:VERSION.exe")) { throw "Instalador não foi compilado." }

      - name: Publicar Release automaticamente
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.target }}
          TAG: ${{ steps.meta.outputs.target_tag }}
        run: |
          $file = "build\installer\MT_Pack_Organizer_Setup_$env:VERSION.exe"
          if (Test-Path "patches\notes.md") {
            gh release create $env:TAG $file --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "MT Pack Organizer $env:VERSION" --notes-file "patches\notes.md"
          } else {
            gh release create $env:TAG $file --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "MT Pack Organizer $env:VERSION" --notes "Atualização automática do MT Pack Organizer."
          }
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar $env:TAG." }

      - name: Resumo
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.target }}
          TAG: ${{ steps.meta.outputs.target_tag }}
          EXISTS: ${{ steps.existing.outputs.exists }}
        run: |
          if ($env:EXISTS -eq 'true') {
            "### $env:TAG já estava publicado" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          } else {
            "### MT Pack Organizer $env:VERSION publicado automaticamente" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            "" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            "A versão foi compilada no GitHub e anexada à Release **$env:TAG**." | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }
